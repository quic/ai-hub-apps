# Config for the dev-only internal suites. The parent cli/pyproject.toml --ignore's
# this directory, so these run only when targeted explicitly:
#
#   cd cli && pytest qai_hub_apps/_internal -m bundler_unit
[pytest]
python_files = *_test.py
markers =
    bundler_unit: unit tests for bundler and generate_registry (run with -m bundler_unit)
    device_test: on-device app tests using the CLI and QDC (run with -m device_test)
    verify_related_models: validate each app's related_models against AI Hub Models metadata (run with -m verify_related_models)
